name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ klasörü repoda yoksa Flutter'ın standart iskeletini üret.
      # Var olan lib/ ve pubspec.yaml dosyalarına dokunmaz.
      - name: Platform iskeleti
        run: |
          if [ ! -d android ]; then
            flutter create --org com.fourmis --project-name shake_rack --platforms android .
            rm -f test/widget_test.dart
          fi

      # minSdk 23, uygulama adı, izinler, sabit imza (tool/patch_android.py)
      - name: Android ayarları
        run: python3 tool/patch_android.py

      # Sabit imza anahtarı: Settings → Secrets → Actions → SHAKE_RACK_SIGNING
      # İçerik: "şifre|keystore_base64". Yoksa derleme durur (yanlış imzalı APK
      # telefona güncelleme olarak kurulamaz).
      - name: İmza anahtarı
        env:
          SIGNING: ${{ secrets.SHAKE_RACK_SIGNING }}
        run: |
          if [ -z "$SIGNING" ]; then
            # Kod yine derlenip test edilsin ama yayınlanmasın.
            echo "::warning::SHAKE_RACK_SIGNING yok → geçici anahtarla derlenecek, YAYINLANMAYACAK."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -storetype PKCS12 -keystore android/app/upload.jks -alias shakerack \
              -keyalg RSA -keysize 2048 -validity 1 -storepass "$PW" -keypass "$PW" -dname "CN=tmp" >/dev/null
            echo "SR_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "NO_PUBLISH=1" >> "$GITHUB_ENV"
            exit 0
          fi
          PW="${SIGNING%%|*}"
          echo "::add-mask::$PW"
          printf '%s' "${SIGNING#*|}" | base64 -d > android/app/upload.jks
          echo "SR_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          keytool -list -keystore android/app/upload.jks -storepass "$PW" | grep -i "SHA-256"

      # Gradle önbelleği: her derlemede yeniden indirme olmasın (ağ hatalarına karşı)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      - name: Testler (mesaj ekranı soruları)
        run: |
          set +e
          flutter test --machine > test-results.jsonl
          code=$?
          python3 tool/test_report.py test-results.jsonl
          exit $code

      - name: Uygulama ikonu
        run: |
          # "flutter_launcher_icons-*.yaml" dosyaları "flavor" sanılır ve ana
          # ikon üretilmez (Flutter logosu kalır) → böyle dosya olmasın
          if ls flutter_launcher_icons-*.yaml >/dev/null 2>&1; then
            echo "::error::flutter_launcher_icons-*.yaml uygulama ikonunu bozar"; exit 1
          fi
          dart run flutter_launcher_icons
          # ikon gerçekten Shake Rack askısı mı? (Flutter varsayılanı değil)
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || {
            echo "::error::Uygulama ikonu üretilmedi"; exit 1; }

      - name: APK derle
        run: |
          # İşlemciye göre ayrı APK + küçültülmüş Dart kodu
          set -o pipefail
          build() {
            flutter build apk --release --split-per-abi \
              --obfuscate --split-debug-info=build/symbols \
              --build-number=${{ github.run_number }} \
              --build-name=1.0.${{ github.run_number }} 2>&1 | tee build.log
          }
          # geçici ağ hatasında (ör. Gradle indirme 5xx) bir kez daha dene
          build || { echo "Tekrar deneniyor…"; sleep 20; build; }

      - name: Derleme hatasını göster
        if: failure()
        run: |
          grep -iE "error|exception|failed|what went wrong|unresolved|cannot|not found" build.log \
            | grep -v "^\s*$" | head -25 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | cut -c1-400)"
            done

      - name: APK adını düzenle
        run: |
          # shake-rack.apk = modern telefonlar (arm64), shake-rack-arm32.apk = eski 32-bit
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk shake-rack.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk shake-rack-arm32.apk
          ls -la shake-rack*.apk

      # Uygulama açılışta bu dosyaya bakıp yeni sürüm olup olmadığını anlar.
      - name: version.json
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os
          msg = (os.environ.get("MSG") or "").strip().splitlines()
          json.dump({
              "build": int(os.environ["GITHUB_RUN_NUMBER"]),
              "name": "1.0." + os.environ["GITHUB_RUN_NUMBER"],
              "notes": msg[0] if msg else "",
              "apk": "https://github.com/emolibor/shake-rack/releases/download/latest/shake-rack.apk",
              "apk_arm32": "https://github.com/emolibor/shake-rack/releases/download/latest/shake-rack-arm32.apk",
          }, open("version.json", "w"), ensure_ascii=False)
          PY
          cat version.json

      # Hata ayıklama sembolleri (küçültülmüş kodun hata kayıtlarını çözmek için)
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.run_number }}
          path: build/symbols
          retention-days: 90

      # "latest" sürümünü her seferinde güncelle → telefondan hep aynı linkten indir.
      - name: Releases'a yükle
        if: env.NO_PUBLISH != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Shake Rack (son sürüm)
          body: |
            Telefona kurmak için **shake-rack.apk** dosyasını indir ve aç.
            İlk kurulumda "bilinmeyen kaynaklardan yüklemeye izin ver" demen gerekebilir.
            Sürüm: 1.0.${{ github.run_number }} · ${{ github.sha }}
          files: |
            shake-rack.apk
            shake-rack-arm32.apk
            version.json
          make_latest: true
          prerelease: false

      - name: İmza anahtarı yoksa uyar
        if: env.NO_PUBLISH == '1'
        run: |
          echo "::error::Derleme başarılı ama SHAKE_RACK_SIGNING secret'ı olmadığı için yayınlanmadı."
          exit 1
