name: shake_rack
description: İpe asılı not kartlarıyla firma proje takibi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  confetti: ^0.7.0
  uuid: ^4.4.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  share_plus: ^10.1.2
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  background_color_ios: "#8B6A3E"
  adaptive_icon_background: "#8B6A3E"
  adaptive_icon_foreground: assets/icon_fg.png
  min_sdk_android: 23
